<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set up automatic payment entry - Pockee</title>
    <meta name="theme-color" content="#FFF9F0">
    <link rel="icon" type="image/webp" href="../assets/images/ic_launcher_512px.webp">
    <!-- 앱이 ?lang=(ko 등) · ?os=26|27 · ?video · #message|#wallet|#notification|#steps(=steps1)|#steps1|#steps2(단계 제목) 를 붙여 연다. video가 있으면 영상 영역으로 가서 해시 경로의 영상을 음소거 자동 재생한다. iOS 26의 Safari는 UA의 OS 버전을 고정하므로 OS는 감지하지 않는다. -->
    <style>
        :root { --primary: #9C5F2A; --bg: #FFF9F0; --surface: #fff; --text: #2E231B; --sub: #8A7B70; --border: #EADFD1; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: var(--bg); color: var(--text); }
        main { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }
        h1 { font-size: 24px; margin: 0 0 12px; }
        h2 { font-size: 19px; margin: 36px 0 12px; }
        h3 { font-size: 17px; margin: 0 0 12px; color: var(--primary); }
        p { color: var(--sub); line-height: 1.6; margin: 8px 0; }
        b { color: var(--text); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; margin: 16px 0; scroll-margin-top: 16px; }
        .seg { display: flex; gap: 8px; margin: 12px 0 4px; }
        .seg button { flex: 1; padding: 12px 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
        .seg button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
        ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
        ol > li { counter-increment: step; position: relative; padding-left: 36px; margin: 0 0 20px; }
        ol > li:last-child { margin-bottom: 0; }
        ol > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 13px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        li p { color: var(--text); margin: 2px 0 10px; }
        .shots { display: flex; flex-wrap: wrap; gap: 10px; }
        .shots img { display: block; height: auto; border: 1px solid var(--border); border-radius: 14px; background: #F2F2F7; }
        .shots img.full { width: min(240px, 100%); }
        .shots img.crop { width: min(320px, 100%); }
        .note { font-size: 14px; }
        .player { width: min(320px, 100%); aspect-ratio: 9 / 16; margin: 16px auto 0; border-radius: 14px; overflow: hidden; background: #F2F2F7; display: flex; align-items: center; justify-content: center; }
        .player iframe { width: 100%; height: 100%; border: 0; }
        .player p { padding: 0 16px; text-align: center; }
        ul.tr { margin: 0; padding-left: 20px; }
        ul.tr li { line-height: 1.6; margin: 0 0 10px; color: var(--text); }
        /* 넓은 화면: 단계를 가로로 나열해 캡처를 한눈에 본다 */
        @media (min-width: 760px) {
            main { max-width: 1080px; padding: 56px 40px 80px; }
            h1 { font-size: 30px; }
            h2 { font-size: 21px; margin-top: 48px; }
            main > p, #os27 > p { max-width: 720px; }
            .seg { max-width: 440px; }
            .card { padding: 28px; }
            ol { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 32px 28px; align-items: start; }
            ol > li { margin: 0; }
            /* 단계가 하나뿐인 카드는 글과 캡처를 옆으로 둔다 */
            ol > li:only-child { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 280px); gap: 24px; }
            .shots { flex-direction: column; }
            .shots img.full, .shots img.crop { width: 100%; max-width: 280px; }
            ul.tr { columns: 2; column-gap: 48px; }
            ul.tr li { break-inside: avoid; }
        }
    </style>
</head>

<main>
    <h1 id="title"></h1>
    <p id="intro"></p>

    <h2 id="osQ"></h2>
    <div class="seg" role="group">

        <button type="button" id="btn27" aria-pressed="false"></button>
    </div>
    <p class="note" id="osHint"></p>

    </div>

</main>

    // 가이드 영상(YouTube ID). OS → 경로 → 언어. 없는 칸은 '준비 중'으로 보인다 — 올린 뒤 ID만 넣으면 앱 업데이트 없이 보인다.
    var VIDEO = {
        '26': {
            message: { ko: '81xn1PKeKMk', en: 'o3I8uEaBtKo', ja: 'CCLCIRJTl2M', 'zh-cn': 'jYlrhNWIZGg', 'zh-tw': 'fDOjR7xNYxI', vi: '7ydY3vCddWM', id: 'Hlwi3v3ftX8' }
        },
        '27': {
            notification: { ko: 'wfOFaAoKSLM', en: 'MN_g6x47rZY', ja: 'v0U0od1Roi8' }
        }
    };
    // 영상을 만드는 언어. 그 밖의 언어(ms, hi)는 영어 영상을 쓴다.
    var VIDEO_LANGS = ['ko', 'en', 'ja', 'zh-cn', 'zh-tw', 'vi', 'id'];
    // OS마다 고를 수 있는 경로와 먼저 보일 경로. iOS 26은 알림 트리거가 없다.
    var VID_ROUTES = { '26': ['message', 'wallet'], '27': ['message', 'notification', 'wallet'] };
    var VID_DEFAULT = { '26': 'message', '27': 'notification' };
    // 단계마다 붙일 캡처. [파일명, 'full' | 'crop']
    var IMG = {
        m26: [[['01-library', 'full']], [['02-automation-tab', 'full']], [['03-triggers', 'full']],
              [['04-message-trigger', 'crop'], ['05-message-keyword', 'full']], [['06-message-run-immediately', 'crop']],
              [['07-pick-shortcut', 'full']], [['08-message-done', 'full']]],
        w26: [[['09-triggers-wallet', 'full']], [], []],
        m27: [[['03-message-unset', 'crop']], [['04-message-set', 'crop']], [['05-message-options', 'crop']]],
        n27: [[['06-notification-unset', 'crop']], [['07-notification-app-picker', 'full']], [['08-notification-app-set', 'crop']]],
        w27: [[['09-wallet-options', 'crop']]],
        add27: [[['02-triggers', 'full']]]
    };
    var FULL_H = 1174;
    var CROP_H = { '04-message-trigger': 560, '06-message-run-immediately': 560, '03-message-unset': 425, '04-message-set': 425,
                   '06-notification-unset': 425, '05-message-options': 493, '08-notification-app-set': 493, '09-wallet-options': 493 };

    function pick() {
        var q = /[?&]lang=([a-zA-Z-]+)/.exec(location.search);
        var list = q ? [q[1]] : [];
        list = list.concat((navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en']);
        for (var i = 0; i < list.length; i++) {
            var r = String(list[i] || '').toLowerCase();
            if (r.indexOf('zh') === 0) return (r.indexOf('tw') >= 0 || r.indexOf('hk') >= 0 || r.indexOf('mo') >= 0 || r.indexOf('hant') >= 0) ? 'zh-tw' : 'zh-cn';
            var base = r.split('-')[0];
            if (base === 'in') base = 'id';
            if (T[base]) return base;
        }
        return 'en';
    }
    var lang = pick();
    var t = T[lang];
    var imgLang = lang === 'ko' ? 'ko' : 'en';
    var vidLang = VIDEO_LANGS.indexOf(lang) >= 0 ? lang : 'en';

    // 번역문의 **굵게** 만 태그로 바꾼다. 나머지는 이스케이프한다.
    function rich(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    }
    function setRich(id, s) { document.getElementById(id).innerHTML = rich(s); }

    function shots(os, list) {
        if (!list || !list.length) return '';
        var html = '<div class="shots">';
        for (var i = 0; i < list.length; i++) {
            var name = list[i][0], kind = list[i][1];
            var h = kind === 'full' ? FULL_H : CROP_H[name];
            html += '<img class="' + kind + '" loading="lazy" alt="" width="540" height="' + h + '" src="../assets/images/guide/payment-shortcut/' + os + '/' + imgLang + '/' + name + '.webp">';
        }
        return html + '</div>';
    }
    function card(route, title, os, steps, imgs, note) {
        var html = '<div class="card" data-route="' + route + '"><h3>' + rich(title) + '</h3>';
        if (steps) {
            html += '<ol>';
            for (var i = 0; i < steps.length; i++) html += '<li><p>' + rich(steps[i]) + '</p>' + shots(os, imgs && imgs[i]) + '</li>';
            html += '</ol>';
        }
        if (note) html += '<p class="note">' + rich(note) + '</p>';
        return html + '</div>';
    }

    document.documentElement.lang = lang;
    document.title = t.title + ' - Pockee';
    setRich('title', t.title);
    setRich('intro', t.intro);
    setRich('osQ', t.osQ);
    setRich('btn26', t.os26);
    setRich('btn27', t.os27);
    setRich('osHint', t.osHint);
    setRich('vidH', t.hVid);
    setRich('s0h', t.s0h);
    setRich('s0', t.s0);
    setRich('s1h', t.s1h);
    setRich('hTr', t.hTr);
    setRich('done', t.done);
    var trHtml = '';
    for (var i = 0; i < t.tr.length; i++) trHtml += '<li>' + rich(t.tr[i]) + '</li>';
    document.getElementById('tr').innerHTML = trHtml;

    document.getElementById('os26').innerHTML =
        card('message', t.hMsg, 'ios26', t.m26, IMG.m26, t.m26note) +
        card('wallet', t.hWal, 'ios26', t.w26, IMG.w26) +
        card('notification', t.hNoti, 'ios26', null, null, t.n26);
    document.getElementById('os27').innerHTML =
        '<p>' + rich(t.i27) + '</p>' +
        card('message', t.hMsg, 'ios27', t.m27, IMG.m27) +
        card('notification', t.hNoti, 'ios27', t.n27, IMG.n27) +
        card('wallet', t.hWal, 'ios27', t.w27, IMG.w27) +
        card('add', t.hAdd, 'ios27', t.add27, IMG.add27);

    var ROUTE_TITLE = { message: t.hMsg, notification: t.hNoti, wallet: t.hWal };
    var vidTabs = document.getElementById('vidTabs');
    var vidOs = '26';
    // 이 OS에 없는 경로면 OS 기본 영상. autoplay는 소리 없이 재생해야 iOS Safari가 막지 않는다(영상에 음성이 없다).
    function playVideo(route, autoplay) {
        if (VID_ROUTES[vidOs].indexOf(route) < 0) route = VID_DEFAULT[vidOs];
        for (var i = 0; i < vidTabs.children.length; i++) {
            vidTabs.children[i].setAttribute('aria-pressed', String(vidTabs.children[i].getAttribute('data-route') === route));
        }
        var id = (VIDEO[vidOs][route] || {})[vidLang];
        document.getElementById('player').innerHTML = id
            ? '<iframe title="' + rich(ROUTE_TITLE[route]) + '" src="https://www.youtube-nocookie.com/embed/' + id + '?playsinline=1&rel=0' +
              (autoplay ? '&autoplay=1&mute=1' : '') + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'
            : '<p>' + rich(t.vidSoon) + '</p>';
    }
    vidTabs.onclick = function (e) {
        var b = e.target.closest('button');
        if (b) playVideo(b.getAttribute('data-route'), true);
    };

    function showOs(os, route, autoplay) {
        document.getElementById('os26').hidden = os !== '26';
        document.getElementById('os27').hidden = os !== '27';
        document.getElementById('btn26').setAttribute('aria-pressed', String(os === '26'));
        document.getElementById('btn27').setAttribute('aria-pressed', String(os === '27'));
        vidOs = os;
        var tabs = '';
        for (var i = 0; i < VID_ROUTES[os].length; i++) {
            var r = VID_ROUTES[os][i];
            tabs += '<button type="button" data-route="' + r + '">' + rich(ROUTE_TITLE[r]) + '</button>';
        }
        vidTabs.innerHTML = tabs;
        playVideo(route, autoplay);
    }
    document.getElementById('btn26').onclick = function () { showOs('26'); };
    document.getElementById('btn27').onclick = function () { showOs('27'); };
    var osQ = /[?&]os=(\d+)/.exec(location.search);
    var os = osQ && parseInt(osQ[1], 10) >= 27 ? '27' : '26';
    var route = location.hash.replace('#', '').replace(/[^a-z0-9]/g, '');
    var STEP_HEADING = { steps: 's0h', steps1: 's0h', steps2: 's1h' };
    var wantVideo = /[?&]video(?:[=&]|$)/.test(location.search);
    showOs(os, route, wantVideo);

    if (wantVideo) {
        document.getElementById('vidH').scrollIntoView();
    } else if (STEP_HEADING[route]) {
        document.getElementById(STEP_HEADING[route]).scrollIntoView();
    } else if (route) {
        var target = document.querySelector('#os' + os + ' [data-route="' + route + '"]');
        if (target) target.scrollIntoView();
    }
})();
</script>
