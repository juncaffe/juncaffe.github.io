<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a shared ledger - Pockee</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#FFF9F0">
    <link rel="icon" type="image/webp" href="assets/images/ic_launcher_512px.webp">
    <!-- 이 페이지의 #PIN은 서버·분석 도구로 보내지 않는다(gtag 등 외부 스크립트 없음). -->
    <style>
        :root { --primary: #9C5F2A; --bg: #FFF9F0; --surface: #fff; --text: #2E231B; --sub: #8A7B70; --border: #EADFD1; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: var(--bg); color: var(--text); }
        main { max-width: 480px; margin: 0 auto; padding: 48px 20px; text-align: center; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { color: var(--sub); line-height: 1.6; margin: 8px 0; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 16px; margin: 24px 0; }
        .pin { font-size: 40px; font-weight: 700; letter-spacing: 8px; color: var(--primary); font-variant-numeric: tabular-nums; }
        .btn { display: inline-block; margin-top: 16px; padding: 14px 24px; background: var(--primary); color: #fff; border-radius: 12px; text-decoration: none; font-weight: 600; }
        .steps { color: var(--text); font-weight: 600; }
    </style>
</head>
<body>
<main>
    <h1 id="title"></h1>
    <p id="desc"></p>
    <div class="card" id="pinCard" hidden>
        <div class="pin" id="pin"></div>
        <p id="pinNote"></p>
    </div>
    <p class="steps" id="steps"></p>
    <a class="btn" id="store" href="https://play.google.com/store/apps/details?id=com.juncaffe.pockee"></a>
</main>
<script>
(function () {
    var T = {
        en: ['Join a shared ledger', 'Open this link on a phone with Pockee installed to join automatically. If the app did not open, enter the PIN below.', 'Invite PIN (valid for a limited time)', 'In Pockee: Ledger list > Join shared ledger, then enter the PIN.', 'Get Pockee'],
        ko: ['공동 가계부 참여', 'Pockee가 설치된 휴대폰에서 이 링크를 열면 자동으로 참여 화면이 열려요. 앱이 열리지 않았다면 아래 PIN을 직접 입력하세요.', '초대 PIN (정해진 시간 동안만 사용할 수 있어요)', 'Pockee 앱에서 가계부 목록 > 공동 가계부 참여를 눌러 PIN을 입력하세요.', 'Pockee 받기'],
        ja: ['共有家計簿に参加', 'Pockeeがインストールされたスマートフォンでこのリンクを開くと、自動で参加画面が開きます。アプリが開かない場合は、下のPINを入力してください。', '招待PIN(一定時間のみ有効)', 'Pockeeアプリで 家計簿一覧 > 共有家計簿に参加 を開き、PINを入力してください。', 'Pockeeを入手'],
        'zh-cn': ['加入共享账本', '在已安装 Pockee 的手机上打开此链接即可自动加入。如果应用没有打开，请输入下方的 PIN。', '邀请 PIN(仅在限定时间内有效)', '在 Pockee 中打开 账本列表 > 加入共享账本，然后输入 PIN。', '获取 Pockee'],
        'zh-tw': ['加入共享帳本', '在已安裝 Pockee 的手機上開啟此連結即可自動加入。如果應用程式沒有開啟，請輸入下方的 PIN。', '邀請 PIN(僅在限定時間內有效)', '在 Pockee 中開啟 帳本列表 > 加入共享帳本，然後輸入 PIN。', '取得 Pockee'],
        vi: ['Tham gia sổ chung', 'Mở liên kết này trên điện thoại đã cài Pockee để tự động tham gia. Nếu ứng dụng không mở, hãy nhập mã PIN bên dưới.', 'PIN mời (chỉ có hiệu lực trong thời gian giới hạn)', 'Trong Pockee: Danh sách sổ > Tham gia sổ chung, rồi nhập mã PIN.', 'Tải Pockee'],
        ms: ['Sertai lejar kongsi', 'Buka pautan ini pada telefon yang memasang Pockee untuk menyertai secara automatik. Jika aplikasi tidak dibuka, masukkan PIN di bawah.', 'PIN jemputan (sah untuk masa terhad sahaja)', 'Dalam Pockee: Senarai lejar > Sertai lejar kongsi, kemudian masukkan PIN.', 'Dapatkan Pockee'],
        hi: ['साझा खाताबही से जुड़ें', 'Pockee इंस्टॉल वाले फ़ोन पर यह लिंक खोलने से आप अपने आप जुड़ जाएँगे। अगर ऐप नहीं खुला, तो नीचे दिया PIN दर्ज करें।', 'आमंत्रण PIN (सीमित समय के लिए मान्य)', 'Pockee में: खाताबही सूची > साझा खाताबही से जुड़ें खोलें, फिर PIN दर्ज करें।', 'Pockee पाएँ'],
        id: ['Gabung buku kas bersama', 'Buka tautan ini di ponsel yang sudah terpasang Pockee untuk bergabung otomatis. Jika aplikasi tidak terbuka, masukkan PIN di bawah.', 'PIN undangan (hanya berlaku dalam waktu terbatas)', 'Di Pockee: Daftar buku kas > Gabung buku kas bersama, lalu masukkan PIN.', 'Dapatkan Pockee']
    };
    function pick() {
        var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
        for (var i = 0; i < list.length; i++) {
            var r = String(list[i] || '').toLowerCase();
            if (r.indexOf('zh') === 0) return (r.indexOf('tw') >= 0 || r.indexOf('hk') >= 0 || r.indexOf('mo') >= 0 || r.indexOf('hant') >= 0) ? 'zh-tw' : 'zh-cn';
            var base = r.split('-')[0];
            if (base === 'in') base = 'id';
            if (T[base]) return base;
        }
        return 'en';
    }
    var lang = pick();
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t[0] + ' - Pockee';
    document.getElementById('title').textContent = t[0];
    document.getElementById('desc').textContent = t[1];
    document.getElementById('pinNote').textContent = t[2];
    document.getElementById('steps').textContent = t[3];
    document.getElementById('store').textContent = t[4];
    var m = /^#(\d{6})$/.exec(location.hash);
    if (m) {
        document.getElementById('pin').textContent = m[1];
        document.getElementById('pinCard').hidden = false;
    }
})();
</script>
</body>
</html>
